<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="M5 AtomS3 Motion Face">
  <rect width="1280" height="320" rx="24" fill="#0c0c18"/>
  <text x="56" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#f1f4ff">AtomS3 Motion Face</text>
  <text x="58" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#8c98b8">Shake it, tilt it, leave it alone - a tiny character reacts.</text>
  <text x="58" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#50c8ff">M5Stack AtomS3  &#183;  MPU6886  &#183;  128x128 display  &#183;  4 characters</text>

  <!-- cat -->
