; M5 AtomS3 Motion Face - build with PlatformIO:  pio run -t upload
[env:atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.2
; Uncomment if the eyes look the wrong way when you tilt the device:
; build_flags = -DLOOK_X_SIGN=-1.0f -DLOOK_Y_SIGN=1.0f
