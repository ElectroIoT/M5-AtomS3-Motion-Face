    <rect x="42" y="62" width="30" height="34" rx="6" fill="#78e682"/><rect x="88" y="62" width="30" height="34" rx="6" fill="#78e682"/>
    <rect x="48" y="68" width="6" height="6" fill="#fff"/><rect x="94" y="68" width="6" height="6" fill="#fff"/>
    <g fill="#78e682"><rect x="46" y="112" width="12" height="5"/><rect x="62" y="112" width="12" height="5"/><rect x="78" y="112" width="12" height="5"/><rect x="94" y="112" width="12" height="5"/></g>
  </g>
