    <circle cx="38" cy="146" r="16" fill="#ff78aa"/><circle cx="70" cy="150" r="16" fill="#ff78aa"/><circle cx="102" cy="146" r="16" fill="#ff78aa"/><circle cx="130" cy="148" r="14" fill="#ff78aa"/>
